name: Build PopVM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson python3 python3-pip python3-venv pkg-config libglib2.0-dev libpixman-1-dev flex bison gettext git
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build QEMU
        run: |
          chmod +x engine/*.sh scripts/*.sh
          meson --version
          ninja --version
          ./engine/build-android.sh

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5-bin.zip
          unzip -q gradle-9.5-bin.zip
          echo "$PWD/gradle-9.5/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PopVM-debug
          path: app/build/outputs/apk/debug/app-debug.apk
