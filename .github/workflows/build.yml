name: Build PopVM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Install dependencies
        run: |
          sudo apt-get update -y --fix-missing || sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build meson python3 python3-pip python3-venv pkg-config \
            libglib2.0-dev libpixman-1-dev flex bison gettext git curl

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/tools/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
            yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Build QEMU
        run: |
          chmod +x *.sh engine/*.sh scripts/*.sh gradlew || true
          export NDK_PATH="${NDK_PATH:-${{ steps.setup-ndk.outputs.ndk-path }}}"
          export ANDROID_NDK_HOME="${NDK_PATH}"
          export ANDROID_NDK_ROOT="${NDK_PATH}"
          meson --version
          ninja --version
          ./engine/build-android.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK
        run: |
          chmod +x gradlew || true
          ./gradlew :app:assembleDebug || gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PopVM-debug
          path: app/build/outputs/apk/debug/app-debug.apk
